<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>定期存款收益计算器</title><style>*{box-sizing:border-box}body{margin:0;background:#f0f3f7;color:#172b40;font:16px -apple-system,BlinkMacSystemFont,'Microsoft YaHei',sans-serif}main{max-width:660px;margin:32px auto;padding:24px;background:white;border-radius:18px;box-shadow:0 8px 40px #1232}header{border-bottom:1px solid #ddd;padding-bottom:18px}h1{font-size:26px;margin:8px 0}small{color:#64748b}label{display:block;margin:18px 0 8px;font-weight:600}input,select,button{font:inherit;border:1px solid #ccd5df;border-radius:8px;padding:12px;width:100%;background:white;color:inherit}input{font-size:20px} .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{background:#142e48;color:white;padding:22px;border-radius:12px;margin:24px 0}.result small{color:#c4d3e2}.big{font-size:32px;font-weight:700;color:#a9e8d0;margin:8px 0 20px}.total{font-size:24px;margin-top:8px}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:12px 4px;text-align:right;border-bottom:1px solid #e4e9ee}td:first-child,th:first-child{text-align:left}button{cursor:pointer}button.primary{background:#173b59;color:white;border:0}footer{font-size:12px;line-height:1.7;color:#64748b;margin-top:18px}@media(max-width:700px){main{margin:12px;padding:18px}.big{font-size:28px}}</style></head><body><main><header><small>TIME DEPOSIT · FINANCIAL CALCULATOR</small><h1>定期存款收益计算器</h1><small>多币种 · 单利测算</small></header><label for="currency">存款币种</label><select id="currency"><option>USD</option><option>HKD</option><option>CNY</option></select><label for="principal">存款本金</label><input id="principal" type="number" min="0" step="any" value="100000"><label for="rate">年化利率（%）</label><input id="rate" type="number" min="0" step="any" value="3.5"><label for="mode">计息方式</label><select id="mode"><option value="month">按月估算</option><option value="day">按实际天数</option></select><div id="monthly"><label for="months">存款期限</label><select id="months"><option value="1">1个月</option><option value="3" selected>3个月</option><option value="6">6个月</option><option value="12">12个月</option></select></div><div id="daily" class="grid" hidden style="display:none"><div><label for="days">实际天数</label><input id="days" type="number" min="0" value="90"></div><div><label for="basis">计息基准</label><select id="basis"><option>360</option><option>365</option><option>366</option></select></div></div><section class="result" aria-live="polite"><small>预计到期利息</small><div class="big" id="interest"></div><small>到期本息合计</small><div class="total" id="total"></div><p id="yield"></p></section><h3>不同存期收益参考</h3><small>假设各存期年化利率相同，按月估算。</small><table><thead><tr><th>期限</th><th>预计利息</th><th>本息合计</th></tr></thead><tbody id="rows"></tbody></table><div class="grid" style="margin-top:22px"><button id="reset">重置</button><button class="primary" id="copy">复制测算结果</button></div><small id="status" role="status"></small><footer>初始数值仅为演示，并非银行实时报价。实际计息基准、利息及到期金额以银行确认为准。不含税费、手续费及汇率损益。所有计算均在本地浏览器完成，不上传输入数据。</footer></main><script>const $=id=>document.getElementById(id),num=id=>Math.max(0,Number($(id).value)||0),fmt=n=>n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});let summary='';function calc(){let c=$('currency').value,p=num('principal'),r=num('rate'),m=$('mode').value==='month',f=m?num('months')/12:num('days')/num('basis'),i=p*r/100*f;$('monthly').style.display=m?'block':'none';$('daily').style.display=m?'none':'grid';$('interest').textContent=c+' '+fmt(i);$('total').textContent=c+' '+fmt(p+i);$('yield').textContent='存期收益率：'+(r*f).toFixed(3)+'%';$('rows').innerHTML=[1,3,6,12].map(n=>`<tr><td>${n}个月</td><td>${fmt(p*r/100*n/12)}</td><td>${fmt(p+p*r/100*n/12)}</td></tr>`).join('');summary=`定期存款收益测算\n币种：${c}\n本金：${fmt(p)}\n年化利率：${r}%\n期限：${m?num('months')+'个月':num('days')+'天（'+num('basis')+'天基准）'}\n预计利息：${fmt(i)}\n本息合计：${fmt(p+i)}\n实际收益以银行确认为准。`;}document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',calc));$('currency').addEventListener('change',()=>{$('basis').value=$('currency').value==='HKD'?'365':'360';calc()});$('reset').onclick=()=>{ $('currency').value='USD';$('principal').value=100000;$('rate').value=3.5;$('mode').value='month';$('months').value=3;$('days').value=90;$('basis').value=360;calc();};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(summary);$('status').textContent='已复制';}catch{let t=document.createElement('textarea');t.value=summary;document.querySelector('main').append(t);t.select();$('status').textContent='请手动复制下方结果';}};calc();</script></body></html>
